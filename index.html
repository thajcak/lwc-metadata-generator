<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Salesforce LWC Metadata XML Generator</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="header">
			<h1>Salesforce LWC Metadata XML Generator</h1>
		</div>
		<div class="container">
			<div class="config-section">
				<form id="configForm">
					<div class="input-row">
						<div class="input-group">
							<label for="apiVersion">API Version</label>
							<input type="number" id="apiVersion" value="61.0" />
						</div>
						<div class="input-group">
							<label for="masterLabel">Master Label</label>
							<input type="text" id="masterLabel" placeholder="Component master label" />
						</div>
						<div class="input-group">
							<label for="isExposed">Is Exposed</label>
							<label class="switch">
								<input type="checkbox" id="isExposed" checked />
								<span class="slider"></span>
							</label>
						</div>
					</div>
					<label for="description">Description:</label>
					<textarea id="description" placeholder="Component description"></textarea>

					<h3>Targets</h3>
					<label class="toggle-label compact-toggle">
						<label class="switch">
							<input type="checkbox" id="groupCompatibleTargets" checked />
							<span class="slider"></span>
						</label>
						Group compatible targets into shared targetConfig blocks
					</label>
					<div id="targetsContainer" class="target-group"></div>
					<div id="validationOutput" class="validation-output" aria-live="polite"></div>
				</form>
			</div>

			<!-- XML Output Section -->
			<div class="xml-section">
				<div class="xml-header">
					<h2>Generated XML</h2>
					<label class="toggle-label compact-toggle xml-toggle">
						<span>Wrap XML</span>
						<label class="switch">
							<input type="checkbox" id="wrapXmlToggle" checked />
							<span class="slider"></span>
						</label>
					</label>
				</div>
				<pre id="xmlOutput"></pre>
			</div>
		</div>
		<script type="module" src="./js/script.js"></script>
	</body>
</html>
